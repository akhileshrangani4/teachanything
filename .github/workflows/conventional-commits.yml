name: PR Conventional Commit Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  pull-requests: read

jobs:
  # The job name is the required status check in the "main" ruleset; keep it.
  validate-pr-title:
    runs-on: ubuntu-latest
    steps:
      # A JavaScript action: it runs on the runner's Node and pulls nothing from
      # Docker Hub, whose outages and rate limits used to fail this check (and
      # block every merge) without ever reading the title.
      - name: PR Conventional Commit Validation
        uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            deps
            revert
            docs
            style
            chore
            refactor
            test
            build
            ci
